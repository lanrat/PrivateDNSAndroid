name: Emulator tests

# Runs the instrumented tests (app/src/androidTest) on emulators of the oldest supported and
# the newest Android version. Uploads screenshots of the app's screens, logcat and the test
# reports as an artifact per Android version.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "fastlane/**"]
  pull_request:
    paths-ignore: ["**.md", "fastlane/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk and the newest platform
        api-level: ["28", "37.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/emulator-tests.sh

      - name: Upload screenshots, logcat and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-android-${{ matrix.api-level }}
          path: emulator-output/
          if-no-files-found: warn
