name: Release

# Releasing only needs a tag named vMAJOR.MINOR.PATCH on the commit to release, e.g.
#   git tag -a v1.13.0 -m "What changed" && git push origin v1.13.0
# The app's versionName and versionCode come from the tag (see app/build.gradle.kts). This
# tests, builds and signs the APK, then publishes a GitHub release with it. The release notes
# are the tag's message, followed by notes GitHub generates from the changes since the last
# release.
#
# Signing needs these repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the keystore file, base64 encoded (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# The APK is built unsigned and signed afterwards, so the build stays reproducible.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  # Name of the APK attached to the release. Keep it in line with earlier releases, so
  # that anything matching release assets by name (e.g. update checkers) keeps working.
  APK_BASENAME: PrivateDNSQuickToggle

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the tags (see app/build.gradle.kts)
          fetch-depth: 0

      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Check the APK's version
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          badging=$("$build_tools/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 1)
          echo "$badging"
          if [[ "$badging" != *"versionName='$VERSION_NAME'"* ]]; then
            echo "::error::The APK's versionName is not $VERSION_NAME"
            exit 1
          fi

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key configured, see the secrets at the top of this workflow"
            exit 1
          fi
          apk="$APK_BASENAME-v$VERSION_NAME.apk"
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$keystore"
          "$build_tools/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag's message, if it is an annotated tag; GitHub's generated notes follow it.
          # Fetched again to be sure to have the tag's own object, which holds the message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes \
            "$APK" "$APK.sha256"
