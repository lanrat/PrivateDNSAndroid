name: Release

# Push a tag named after the versionName in app/build.gradle.kts, e.g.
#   git tag v1.12.0 && git push origin v1.12.0
# This builds and tests the release APK and creates a *draft* GitHub release with it.
# Review the draft and publish it by hand.
#
# Signing is optional. To sign, add these repository secrets (Settings > Secrets and
# variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the keystore file, base64 encoded (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Without them the release gets the unsigned APK, which can be signed locally with apksigner.
# The APK is built unsigned and signed afterwards, so the build stays reproducible.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  # Name of the APK attached to the release. Keep it in line with earlier releases, so
  # that anything matching release assets by name (e.g. update checkers) keeps working.
  APK_BASENAME: PrivateDNSQuickToggle

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version_name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [ "v$version_name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            apk="$APK_BASENAME-v$VERSION_NAME.apk"
            keystore="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$build_tools/apksigner" sign \
              --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$apk" "$unsigned"
            rm -f "$keystore"
            "$build_tools/apksigner" verify --print-certs "$apk"
          else
            apk="$APK_BASENAME-v$VERSION_NAME-unsigned.apk"
            echo "::warning::No signing key configured, the release gets an unsigned APK"
            cp "$unsigned" "$apk"
          fi
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes from the F-Droid/IzzyOnDroid changelog of this versionCode, if there is one
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ -f "$changelog" ]; then
            notes=(--notes-file "$changelog")
          else
            echo "::warning::$changelog not found, using generated release notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" "${notes[@]}" \
            "$APK" "$APK.sha256"
